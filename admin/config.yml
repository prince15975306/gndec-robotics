backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_content"
    label: "Website Content"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Club Logo URL", name: "logo", widget: "image"}
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
          - label: "Notice Board Items"
            name: "notices"
            widget: "list"
            fields:
              - {label: "Notice Text", name: "text", widget: "string"}
              - {label: "Link / Action URL", name: "link", widget: "string", required: false}
          - {label: "About Us Text", name: "about_text", widget: "text"}
          - {label: "Vision Text", name: "vision_text", widget: "text"}
          - {label: "Mission Text", name: "mission_text", widget: "text"}

  - name: "events"
    label: "Robotics Events"
    folder: "_posts/events"
    create: true
    fields:
      - {label: "Event Title", name: "title", widget: "string"}
      - {label: "Event Date", name: "date", widget: "date"}
      - {label: "Event Banner Image", name: "image", widget: "image"}
      - {label: "Description", name: "body", widget: "markdown"}
